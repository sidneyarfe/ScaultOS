  <rect width="256" height="256" rx="56" fill="#0B0B0E"/>
  <rect x="56" y="48" width="96" height="160" rx="16" fill="#8DCCFF"/>
  <rect x="168" y="48" width="32" height="160" rx="16" fill="#A3C5CE" opacity=".5"/>
</svg>
