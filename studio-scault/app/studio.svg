<!-- Ícone do studio.scault. Mesmo desenho do favicon do painel
     (painel/index.html), escalado 8x pro canvas de 256:
       fundo grafite arredondado + slide azul + slide seguinte espiando.
     Fonte única do ícone: _icone/gerar.sh rasteriza este arquivo em
     studio.ico (atalho) e painel/icone-*.png (aba / barra de tarefas). -->
